name: CI

on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore Bloxstrap/Bloxstrap.csproj

    - name: Build
      run: dotnet build --no-restore -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} Bloxstrap/Bloxstrap.csproj

    - name: Publish
      run: dotnet publish -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained false Bloxstrap/Bloxstrap.csproj

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: SakuraTrap-${{ github.sha }}
        path: Bloxstrap/bin/Release/net6.0-windows/win-x64/publish/SakuraTrap.exe
        archive: false

    - name: Release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create ${{ github.ref_name }} "Bloxstrap/bin/Release/net6.0-windows/win-x64/publish/SakuraTrap.exe" --title "SakuraTrap ${{ github.ref_name }}" --generate-notes
